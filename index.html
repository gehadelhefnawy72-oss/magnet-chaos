<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">

<title>Magnet Chaos - Scrapyard Tycoon</title>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<style>
:root{--asphalt:#1d1a18;--hazard:#ffc400;--volt:#3fd0ff;--cash:#5cff8a;--rust:#c4562a;--steel:#8a9199;--ink:#f3ede2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#14110f;color:var(--ink);font-family:Impact,'Arial Black','Segoe UI',Tahoma,sans-serif;touch-action:none}
canvas{position:fixed;left:0;top:0;display:block}
.hud{position:fixed;z-index:2;pointer-events:none}
#left{left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip{background:rgba(29,26,24,.92);border-left:6px solid var(--hazard);padding:3px 12px;font-size:18px;letter-spacing:.5px;min-width:120px}
.chip.big{font-size:34px;color:var(--cash);line-height:1.1}
.bar{height:6px;background:#00000099;margin-top:3px;width:130px}
.bar i{display:block;height:100%;width:0;background:var(--volt)}
#nit .bar i{background:var(--hazard)}
#heat{font-size:22px;letter-spacing:3px}
#heat .on{color:#ff4b3e}#heat .off{color:#5a514a}
#right{right:calc(max(10px,env(safe-area-inset-right)) + 62px);top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto;z-index:9999}
#muteWrap{right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:20;pointer-events:auto}
body.shopOpen #shopBtn{visibility:hidden}
#shopBtn{position:relative;z-index:9999;pointer-events:auto;cursor:pointer;touch-action:manipulation}
#shopBtn::before{content:'';position:absolute;top:-6px;bottom:-6px;left:-6px;right:-4px;background:transparent}
body.shopOpen .panel{margin-top:58px;max-height:calc(94vh - 58px)}
body.touch .kb{display:none}
.btn{font:inherit;font-size:18px;background:var(--hazard);color:var(--asphalt);border:0;padding:8px 14px;cursor:pointer;border-radius:3px;box-shadow:0 4px 0 #8a6a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a00}
#topc{left:0;right:0;margin:0 auto;width:max-content;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px;max-width:min(54vw,560px)}
#banner{display:none;opacity:0;transition:opacity .3s;background:rgba(29,26,24,.94);border-bottom:4px solid var(--hazard);padding:4px 16px;font-size:clamp(13px,2.1vw,26px);color:var(--hazard);text-shadow:0 2px 0 #000;text-align:center;line-height:1.15}
#timers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#combo{left:50%;top:34%;transform:translateX(-50%) scale(1);font-size:clamp(28px,5vw,60px);color:#fff;text-shadow:0 4px 0 var(--rust),0 0 18px #000;opacity:0;transition:opacity .18s,transform .15s;white-space:nowrap;max-width:94vw;text-align:center}
#hint{left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--asphalt);padding:6px 16px;font-size:15px;color:var(--steel);opacity:1;transition:opacity 1.5s;text-align:center;max-width:46vw}
#touch{display:none}
body.touch #touch{display:block}
#stickZone{position:fixed;left:0;top:27%;width:50%;height:73%;z-index:3;touch-action:none}
#stickBase{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.1);box-shadow:0 0 0 1.5px rgba(0,0,0,.35),0 0 14px rgba(63,208,255,.3),inset 0 0 12px rgba(0,0,0,.25);z-index:3;display:none;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s}
#stickBase.show{display:block;opacity:.55;visibility:visible}
#stickBase.show.ghost{opacity:.15}
#stickKnob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:rgba(255,255,255,.8);border:2px solid var(--volt);box-shadow:0 0 0 1.5px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.45)}
.tbtn{position:fixed;z-index:3;border:0;border-radius:50%;font:inherit;color:var(--asphalt);background:var(--volt);box-shadow:0 6px 0 #1a7a99;touch-action:none}
#magBtn{right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:150px;height:150px;font-size:24px}
#magZone{position:fixed;right:0;top:0;width:50%;height:100%;z-index:2;touch-action:none}
#magBtn.on{background:#fff;box-shadow:0 0 28px var(--volt)}
#nitroBtn{right:calc(max(20px,env(safe-area-inset-right)) + 150px + 24px);bottom:max(40px,calc(env(safe-area-inset-bottom) + 14px));width:76px;height:76px;font-size:14px;background:var(--hazard);box-shadow:0 5px 0 #8a6a00}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:#14110f;color:var(--hazard);align-items:center;justify-content:center;text-align:center;font-size:24px;padding:20px}



html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden}
@supports(height:100dvh){html,body{height:100dvh}}
canvas{position:fixed;left:0;top:0;right:0;bottom:0;background:#14110f}
#fsBtn{font-size:18px}
#shop{position:fixed;inset:0;padding:max(4px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));z-index:10;background:rgba(10,8,7,.82);display:none;align-items:center;justify-content:center;touch-action:pan-y}
#shop.open{display:flex}
.panel{width:min(880px,96vw);max-height:94vh;overflow:auto;background:var(--asphalt);border-top:14px solid transparent;border-image:repeating-linear-gradient(-45deg,var(--hazard) 0 16px,#1d1a18 16px 32px) 14;padding:12px 16px 16px}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:28px;margin-bottom:10px;gap:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.cols{grid-template-columns:1fr}.ptitle{font-size:22px}}
.tabs{display:none;gap:8px;margin-bottom:8px}.tab{flex:1;font:inherit;font-size:18px;padding:10px;background:#3a342f;color:var(--steel);border:0;border-radius:3px;cursor:pointer}.tab.on{background:var(--hazard);color:var(--asphalt)}
@media(max-width:700px){.tabs{display:flex}#cols[data-tab=up]>section:nth-child(2){display:none}#cols[data-tab=zn]>section:nth-child(1){display:none}}
.ico{font-size:26px;width:34px;text-align:center;flex:none}.row>div:first-child{display:flex;gap:10px;align-items:center}.row>div:first-child>div{min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #3a342f}
.row b{font-size:19px;font-weight:normal}
.row small{display:block;color:var(--steel);font-family:'Segoe UI',Tahoma,sans-serif;font-size:13px}
.pips{display:flex;gap:3px;margin-top:4px}
.pip{width:14px;height:7px;background:#3a342f}.pip.on{background:var(--volt)}
.buy{min-width:96px;font:inherit;font-size:17px;background:var(--cash);color:#06260f;border:0;padding:8px 10px;cursor:pointer;border-radius:3px}
.buy:disabled{background:#3a342f;color:#7d746c;cursor:default}
.buy.alt{background:var(--hazard);color:var(--asphalt)}
.sec{font-size:15px;color:var(--steel);margin:4px 0}
.ad{width:100%;margin-top:8px;background:var(--volt);color:var(--asphalt)}
.ad:disabled{background:#3a342f}
.set{display:flex;gap:8px;margin-top:10px}
.set .buy{flex:1;min-width:0;font-size:14px;padding:8px 4px;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#3a342f;color:var(--ink)}.set .buy.alt{background:var(--hazard);color:var(--asphalt);flex:1.6;overflow:visible;text-overflow:clip;font-size:13px}
body.kbd #touch,body.kbd #stickBase,body.kbd #magZone{display:none!important}
#langWrap{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#boardBtn{font-size:18px;min-width:44px}
#board{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:6px}
#board.open{display:flex}
.rv{color:var(--hazard);font-size:20px;text-align:end}
.bnote{display:block;margin-top:10px;color:var(--steel);line-height:1.5}
#frzBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:max(110px,env(safe-area-inset-bottom));z-index:21;display:none;pointer-events:auto;font-size:18px}
#right #frzBtn{position:static;transform:none;bottom:auto;font-size:14px;padding:4px 10px;z-index:auto;white-space:nowrap}
@media(orientation:portrait){#right #frzBtn{position:fixed;left:8px;top:192px;right:auto}}
body.shopOpen #frzBtn,body.shopOpen #frzFx{display:none!important}
.ver{font-size:11px;color:var(--steel);opacity:.55;font-family:monospace}
#startLang{background:transparent;color:var(--steel);box-shadow:none;border:1px solid rgba(255,255,255,.25);font-size:14px;padding:4px 14px;opacity:.85;margin-top:4px}
#warnFx{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 40%,rgba(255,30,30,.45));opacity:0}#warnFx.on{animation:wfx 1.6s ease-out}@keyframes wfx{0%,40%,80%{opacity:1}20%,60%,100%{opacity:0}}
#frzFx{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(120,200,255,.05),rgba(120,200,255,.28));opacity:0;transition:opacity .25s}
#mission{background:rgba(29,26,24,.92);border-left:5px solid var(--volt);padding:3px 12px;font-size:clamp(12px,1.9vw,18px);color:var(--ink);text-align:center;line-height:1.3}
#mission .g{color:var(--hazard);margin-inline-end:6px;letter-spacing:1px}
#mission.flash{animation:mflash .7s}
@keyframes mflash{0%{background:#5cff8a;color:#06260f}100%{background:rgba(29,26,24,.92)}}
#shopBtn.pulse{animation:pulseBtn .9s ease-in-out infinite}
@keyframes pulseBtn{50%{transform:scale(1.1);box-shadow:0 4px 0 #8a6a00,0 0 18px var(--hazard)}}
.tm{background:rgba(29,26,24,.92);border-bottom:3px solid var(--volt);padding:2px 10px;font-size:15px;color:var(--volt)}
#langWrap{right:max(10px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 52px);z-index:20;pointer-events:auto}
#langBtn{font-size:16px;min-width:44px}
body.shopOpen #langWrap{visibility:hidden}
#start{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,17,15,.55) 0%,rgba(10,8,7,.9) 100%);padding:12px}
#start.gone{display:none}
#start::before,#start::after{content:'';position:absolute;left:0;right:0;height:clamp(10px,2.4vh,22px);background:repeating-linear-gradient(-45deg,var(--hazard) 0 18px,#1d1a18 18px 36px)}
#start::before{top:0}#start::after{bottom:0}
.sbox{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.2vh,20px);text-align:center;max-width:94vw}
.stitle{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(40px,min(12vw,19vh),132px);line-height:.95;color:var(--hazard);letter-spacing:2px;text-shadow:0 4px 0 var(--rust),0 8px 0 #000;transform:rotate(-2deg)}
.stitle span{display:block}.stitle span+span{color:var(--ink)}
.ssub{font-size:clamp(16px,3.4vh,30px);color:var(--volt);letter-spacing:3px}
.playbtn{font:inherit;font-size:clamp(28px,7vh,52px);padding:.28em 1.6em;background:var(--hazard);color:var(--asphalt);border:0;border-radius:6px;box-shadow:0 8px 0 #8a6a00,0 0 30px rgba(255,196,0,.35);cursor:pointer;animation:pulsePlay 1.4s ease-in-out infinite;letter-spacing:3px;touch-action:manipulation}
@keyframes pulsePlay{50%{transform:scale(1.05)}}
.sctl{font-size:clamp(12px,2.2vh,17px);color:var(--steel);max-width:90vw;line-height:1.5;font-family:'Segoe UI',Tahoma,sans-serif}
body.ar{font-family:'Segoe UI',Tahoma,'Noto Sans Arabic','Geeza Pro',Arial,sans-serif;font-weight:700}
body.ar .chip{font-size:21px;line-height:1.5;padding:2px 12px}
body.ar .chip.big{font-size:34px}
body.ar #mission{font-size:clamp(14px,2.3vw,22px);line-height:1.5}
body.ar #banner{font-size:clamp(16px,2.7vw,32px);line-height:1.55;padding:6px 18px}
body.ar #combo{font-size:clamp(34px,6.2vw,72px);line-height:1.5}
body.ar #hint{font-size:17px;line-height:1.6}
body.ar .btn{font-size:20px;line-height:1.4}
body.ar .ptitle{font-size:32px;line-height:1.4}
body.ar .row b{font-size:23px;line-height:1.45}
body.ar .row small{font-size:16px;line-height:1.5}
body.ar .buy{font-size:20px;line-height:1.4;min-width:104px}
body.ar .set .buy,body.ar .set .buy.alt{white-space:normal;overflow:hidden;font-size:14px;line-height:1.3;padding:6px 4px}
#langBtn{white-space:nowrap;padding:6px 12px;line-height:1.3}
body.ar #langBtn{font-size:16px}
body.ar .sec{font-size:19px}
body.ar .sctl{font-size:clamp(14px,2.6vh,20px)}
@media(max-width:700px){body.ar .ptitle{font-size:24px}body.ar .row b{font-size:20px}}
@media(orientation:landscape) and (max-height:560px){body.ar .ptitle{font-size:22px}body.ar .row b{font-size:18px}body.ar .row small{font-size:13px}body.ar .buy{font-size:16px;min-width:84px}body.ar .btn{font-size:17px}body.ar .chip{font-size:18px}}
@media(orientation:landscape) and (max-height:420px){body.ar .ptitle{font-size:19px}body.ar .row b{font-size:16px}body.ar .row small{font-size:12px}body.ar .buy{font-size:14px}body.ar .btn{font-size:15px}}
/* ---- landscape / 16:9 layout ---- */
@media(orientation:landscape){.cols{grid-template-columns:1fr 1fr}}
@media(orientation:landscape) and (max-height:560px){
  body.shopOpen #muteWrap,body.shopOpen #fsWrap{visibility:hidden}
  .panel,body.shopOpen .panel{width:min(980px,96vw);max-height:calc(100vh - 10px);max-height:calc(100dvh - 10px);margin-top:0;padding:4px 12px 10px;border-top-width:8px}
  .ptitle{font-size:18px;margin-bottom:4px}
  .cols{gap:14px}
  .row{padding:4px 0;gap:8px}
  .row b{font-size:15px}
  .row small{font-size:11px}
  .pips{margin-top:2px}.pip{width:11px;height:5px}
  .buy{font-size:14px;padding:5px 8px;min-width:78px}
  .sec{font-size:13px;margin:2px 0}
  .ad{margin-top:4px}.set{margin-top:6px}
  .btn{font-size:15px;padding:5px 10px}
}
@media(orientation:landscape) and (max-height:420px){
  .panel,body.shopOpen .panel{padding:2px 10px 6px}
  .ptitle{font-size:16px;margin-bottom:2px}
  .row{padding:2px 0}.row b{font-size:14px}.row small{font-size:10px}
  .buy{font-size:13px;padding:3px 7px;min-width:70px}
  .ad{margin-top:3px;font-size:12px;padding:3px 6px}.set{margin-top:4px}

}
@media(orientation:landscape) and (min-height:561px){.panel{max-height:92vh;max-height:92dvh}}
</style>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
document.querySelectorAll('body > *:not(script)').forEach(e=>{e.setAttribute('translate','no');e.classList.add('notranslate');});
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a), TAU=Math.PI*2;
const mod=(a,n)=>((a%n)+n)%n;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ================= POKI SDK (safe wrappers, no-ops when SDK is absent) ================= */
let adActive=false,focusLost=false,sdkOk=false,uiOk=false,loadedSent=false,adsReady=false;
const SHOW_REWARDED=false; /* master switch: set false to keep the Watch Ad button hidden (e.g. during first Poki review) */
function resumeAfterAd(){try{if(started&&!shopOpen&&!document.hidden)setPlaying(true);}catch(e){}}
const poki={
  init(){
    const go=()=>{sdkOk=true;poki.ready();};
    try{if(window.PokiSDK){PokiSDK.init().then(()=>{adsReady=true;go();try{if(shopOpen)renderShop();}catch(e){}}).catch(go);}}catch(e){}
  },
  ready(){if(loadedSent||!sdkOk||!uiOk)return;loadedSent=true;try{PokiSDK.gameLoadingFinished();}catch(e){}},
  start(){try{window.PokiSDK&&PokiSDK.gameplayStart();}catch(e){}},
  stop(){try{window.PokiSDK&&PokiSDK.gameplayStop();}catch(e){}},
  rewarded(cb){
    if(adActive)return;
    adActive=true;setPlaying(false);refreshHold();
    let fin=false;
    const done=ok=>{if(fin)return;fin=true;adActive=false;refreshHold();resumeAfterAd();if(ok)cb();};
    setTimeout(()=>done(false),90000);
    try{if(window.PokiSDK){PokiSDK.rewardedBreak().then(r=>done(r!==false)).catch(()=>done(false));return;}}catch(e){}
    done(true);
  },
  commercial(cb){
    if(adActive)return;
    adActive=true;setPlaying(false);refreshHold();
    let fin=false;
    const done=()=>{if(fin)return;fin=true;adActive=false;refreshHold();cb();resumeAfterAd();};

function collide(a,b){
  if(a.crush>=0||b.crush>=0)return;
  if(flying(a)||flying(b))return;
  const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;
  if(d2>=rr*rr||d2===0)return;
  const iA=a.held?0:(a.truck?1/(a.r*a.r*3):1/(a.r*a.r*(a.t.heavy||1))),iB=b.held?0:(b.truck?1/(b.r*b.r*3):1/(b.r*b.r*(b.t.heavy||1))),sum=iA+iB;
  if(sum===0)return;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=rr-d;
  a.x-=nx*ov*iA/sum;a.y-=ny*ov*iA/sum;b.x+=nx*ov*iB/sum;b.y+=ny*ov*iB/sum;
  const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(vn<0){
    const j=-(1.45)*vn/sum;
    a.vx-=j*iA*nx;a.vy-=j*iA*ny;b.vx+=j*iB*nx;b.vy+=j*iB*ny;
    const imp=-vn;
    if(!a.truck)a.va+=rnd(-1,1)*imp*0.01;if(!b.truck)b.va+=rnd(-1,1)*imp*0.01;
    if(imp>110){if(!a.truck)a.dmg=(a.dmg||0)+1;if(!b.truck)b.dmg=(b.dmg||0)+1;}
    if(imp>(save.xp<400?125:170)&&(isActive(a)||isActive(b)))smash(a,b,imp,(a.x+b.x)/2,(a.y+b.y)/2);
    else if(imp>90){sfx('clang',.4);}
    if((a.truck||b.truck)&&imp>150)shake=Math.max(shake,Math.min(7,imp/45));
  }
}
function isActive(o){return o.held||o.fling>0||(o.truck&&Math.hypot(o.vx,o.vy)>190);}

/* ---------- helpers: colour shading + textures ---------- */

  {let na=0;for(const o of objs){if((o.t.special||(o.t.en&&!o.soft))&&!o.dead&&!o.held&&na<3){edgeArrow(o.x,o.y,o.t.en?'#ff4b3e':o.t.drone?'#6fe3ff':'#ffd23f',S()['ar_'+o.n]||'');na++;}}}
}

/* ================= HUD ================= */
const hudCache={};
function setTxt(id,v,html){if(hudCache[id]===v)return;hudCache[id]=v;const e=$(id);if(html)e.innerHTML=v;else e.textContent=v;}
let hudLast=0,mIdx=-1;
const MIS=[
 {k:'m1',done:()=>stat.crushed>=2||save.xp>=100,prog:()=>Math.min(2,stat.crushed)+'/2'},
 {k:'m2',done:()=>save.up.magnet>=1,prog:()=>'$'+Math.min(save.cash,30)+'/$30'},
 {k:'m3',done:()=>stat.maxCombo>=2||save.xp>=160,prog:()=>''},
 {k:'m4',done:()=>lvl()>=3,prog:()=>'LV '+lvl()+'/3'},
 {k:'m5',done:()=>save.zones.every(Boolean),prog:()=>''},
 {k:'m6',done:()=>['magnet','rope','engine','crusher'].every(k=>save.up[k]>=UPS[k].max),prog:()=>''}
];
function updateMission(){
  let i=-1;for(let j=0;j<MIS.length;j++)if(!MIS[j].done()){i=j;break;}
  const e=$('mission');
  if(i<0){if(e.style.display!=='none')e.style.display='none';return;}
  if(e.style.display==='none')e.style.display='';
  const m=MIS[i],ar=save.lang==='ar';let txt=S()[m.k],pr=m.prog();
  if(m.k==='m2')txt+=' ($30)';
  if(m.k==='m5'){const z=ZONES[save.zones.indexOf(false)];txt+=' '+z.n[save.lang]+' ('+'$'+fmt(z.cost)+' · '+(ar?'مستوى ':'LV ')+z.lvl+')';pr='$'+fmt(Math.min(save.cash,z.cost))+'/$'+fmt(z.cost);}
  const full=txt+(pr?'  '+pr:'');
  if(hudCache.mission!==i+'|'+full){
    hudCache.mission=i+'|'+full;$('missionTxt').textContent=full;
    if(mIdx!==i){if(mIdx>=0&&started){e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');sfx('cha');}mIdx=i;}
  }
  $('shopBtn').classList.toggle('pulse',i===1&&save.cash>=30&&!shopOpen);
}
function updateStickGhost(){
  const b=$('stickBase');if(!b||!joy.active)return;
  const z=cam.z,x0=(crusher.x-cam.x)*z+W/2,y0=(crusher.y-cam.y)*z+H/2,x1=x0+crusher.w*z,y1=y0+crusher.h*z;
  b.classList.toggle('ghost',joyOX>x0-50&&joyOX<x1+50&&joyOY>y0-50&&joyOY<y1+50);
}
function updateHud(){
  const nowT=performance.now();if(nowT-hudLast<80)return;hudLast=nowT;
  setTxt('cash','$'+fmt(save.cash));
  const l=lvl(),lo=40*(l-1)*(l-1),hi=40*l*l;
  setTxt('lvl',(save.prestige>=10?S().king+' · ':save.prestige>0?'P'+save.prestige+' · ':'')+(save.lang==='ar'?'مستوى ':'LV ')+l);
  const xp=clamp((save.xp-lo)/(hi-lo),0,1)*100;if(hudCache.xp!==(xp|0)){hudCache.xp=xp|0;$('xpbar').style.width=xp+'%';}
  const st=Math.floor(heat);let h='';for(let i=1;i<=5;i++)h+='<span class="'+(i<=st?'on':'off')+'">\u2605</span>';setTxt('heat',h,true);
  const nb=Math.round(nitro*100);if(hudCache.nb!==nb){hudCache.nb=nb;$('nitbar').style.width=nb+'%';}
  setTxt('timers',surgeT>0?'<div class="tm">'+S().timerSurge+' '+Math.ceil(surgeT)+'s</div>':'',true);
  {const fb=$('frzBtn'),has=save.up.frz>0;if(fb.style.display!==(has?'block':'none'))fb.style.display=has?'block':'none';
   if(has){fb.textContent='❄ '+(freezeCD>0?Math.ceil(freezeCD)+'s':(isTouch?S().frzBtn.replace(/ \[F\]/,''):S().frzBtn));fb.disabled=freezeCD>0||freezeT>0;}
   $('frzFx').style.opacity=freezeT>0?1:0;}
  updateMission();updateStickGhost();
}
function syncMute(){$('muteBtn').innerHTML=save.mute?'&#128263;':'&#128266;';if(AC)master.gain.value=(save.mute||audioHold)?0:0.55;}
$('muteBtn').addEventListener('click',()=>{initAudio();save.mute=!save.mute;syncMute();});
function applyLang(){
  const s=S(),ar=save.lang==='ar',d=ar?'rtl':'ltr';
  document.body.classList.toggle('ar',ar);document.documentElement.lang=ar?'ar':'en';
  document.querySelectorAll('[data-i]').forEach(e=>{const t=s[e.dataset.i];if(t)e.textContent=t;});
  const ctl=isTouch?s.hintT:s.hintK;
  $('hint').textContent=ctl;$('hint').dir=d;$('startCtl').textContent=ctl;$('startCtl').dir=d;
  $('langBtn').textContent=ar?'EN':'عربي';$('startLang').textContent=ar?'English':'العربية';
  $('mission').dir=d;$('shop').dir=d;
  $('shopBtn').firstElementChild.textContent=s.upgrades;
  hudCache.lvl=null;hudCache.mission=null;
}
function toggleLang(){save.lang=save.lang==='en'?'ar':'en';save.langSet=true;applyLang();if(shopOpen){renderShop();if($('board').classList.contains('open'))renderBoard();}store();}
$('langBtn').addEventListener('click',e=>{e.stopPropagation();toggleLang();this_blur(e);});
$('startLang').addEventListener('click',e=>{e.stopPropagation();toggleLang();});
function this_blur(e){try{e.currentTarget.blur();}catch(_){}}
function launchConvoy(){
  if(save.zone!==0||save.xp>=400)return;
  const ty=['compact','barrel','bike','compact','barrel','cart'];
  for(let i=0;i<12;i++)mk(ty[i%ty.length],truck.x+170+i*72,truck.y+(i%2?26:-26));
  for(let i=0;i<7;i++)mk(ty[(i+2)%ty.length],truck.x+230+i*100,truck.y+(i%2?-150:150));
}
function startGame(){
  if(started)return;launchConvoy();started=true;initAudio();$('start').classList.add('gone');
  hintT=14;$('hint').style.opacity=1;if(!document.hidden)setPlaying(true);refreshHold();
}
$('playBtn').addEventListener('click',e=>{e.stopPropagation();startGame();});
$('start').style.display='none';startGame(); /* instant play: no start screen */
try{if(window.self!==window.top)$('fsWrap').style.display='none';}catch(e){$('fsWrap').style.display='none';}

/* ================= SHOP ================= */
function renderShop(){
  const s=S();
  $('shopTitle').textContent=s.shop;$('resume').textContent=s.resume;$('zoneHead').textContent=s.zones;
  let h='';
  for(const k of Object.keys(UPS)){
    const lv=save.up[k],u=UPS[k],cost=upCost(k),lk=u.unlock&&totLvl()<u.unlock;
    let pips='';for(let i=0;i<u.max;i++)pips+='<i class="pip'+(i<lv?' on':'')+'"></i>';
    h+='<div class="row"><div><span class="ico">'+(UPI[k]||'')+'</span><div><b>'+s[k]+(k==='crusher'?' x'+crushMult():'')+'</b><small>'+s[k+'D']+'</small><div class="pips">'+pips+'</div></div></div>'+
       '<button class="buy" data-act="up" data-k="'+k+'" '+(lk||cost==null||save.cash<cost?'disabled':'')+'>'+(lk?s.unlockAt+' '+u.unlock:cost==null?s.max:'$'+fmt(cost))+'</button></div>';
  }
  $('upList').innerHTML=h;$('tabUp').textContent=s.upgrades;$('tabZn').textContent=s.zones;
  let zh='';
  let firstLocked=-1,hid=0;
  ZONES.forEach((z,i)=>{
    const un=save.zones[i];let label,attr,sub='';
    if(!un){if(firstLocked<0)firstLocked=i;if(i>firstLocked+2){hid++;return;}}
    if(i===save.zone){label=s.here;attr='disabled';}
    else if(un){label=s.go;attr='data-act="go" data-i="'+i+'"';}
    else{const ok=save.cash>=z.cost&&totLvl()>=z.lvl;label=s.unlock+' $'+fmt(z.cost);attr=ok?'data-act="unlock" data-i="'+i+'"':'disabled';sub=s.need+' '+z.lvl;}
    zh+='<div class="row"><div><b>'+z.n[save.lang]+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div><button class="buy alt" '+attr+'>'+label+'</button></div>';
  });
  if(hid)zh+='<div class="row"><small>+'+hid+' '+s.moreCities+'</small></div>';
  $('zoneList').innerHTML=zh;
  $('extras').innerHTML='<div class="set"><button class="buy" data-act="lang">'+s.lang+'</button><button class="buy" data-act="snd">'+s.sound+': '+(save.mute?s.off:s.on)+'</button>'+((SHOW_REWARDED&&adsReady)?'<button class="buy alt" data-act="reward">&#127916; '+(save.lang==='ar'?'شاهد إعلان: +$':'Watch Ad: +$')+fmt(rewardAmt())+'</button>':'')+'</div>';
}
function renderBoard(){
  const s=S(),ar=save.lang==='ar';
  $('boardTitle').textContent='🏆 '+s.boardT;$('boardClose').textContent=s.resume;
  const done=save.zones.filter(Boolean).length;
  const rows=[[s.rkTitle,save.prestige>=10?s.king:s.prestige+' '+save.prestige],[s.rkLevel,totLvl()+' / 1000'],[s.rkCash,'$'+fmt(save.cash)],[s.rkTotal,'$'+fmt(save.totalEarned)],[s.rkCombo,'x'+save.bestCombo],[s.rkCities,done+'/'+ZONES.length],[s.rkNow,ZONES[save.zone].n[save.lang]]];
  let h=rows.map(r=>'<div class="row"><div><b>'+r[0]+'</b></div><div class="rv">'+r[1]+'</div></div>').join('');
  h+='<div class="sec">'+s.rkFirst+'</div>';
  h+=Object.keys(save.firsts).map(Number).sort((a,b)=>save.firsts[b]-save.firsts[a]).slice(0,8).map(i=>'<div class="row"><div><b>'+ZONES[i].n[save.lang]+'</b></div><div class="rv">'+new Date(save.firsts[i]).toLocaleDateString(ar?'ar':'en')+'</div></div>').join('');
  h+='<small class="bnote">'+s.boardNote+'</small>';
  $('boardBody').innerHTML=h;
}
function openBoard(){if(shopOpen)return;shopOpen=true;for(const k in keys)keys[k]=false;joy.active=false;hideStick();setMagnet(false);setPlaying(false);refreshHold();document.body.classList.add('shopOpen');renderBoard();$('board').classList.add('open');}
$('boardBtn').addEventListener('click',e=>{e.stopPropagation();e.currentTarget.blur();if(started)openBoard();});
$('boardClose').addEventListener('click',closeShop);
$('frzBtn').addEventListener('pointerdown',e=>{e.stopPropagation();useFreeze();});
function openShop(){if(shopOpen)return;shopOpen=true;for(const k in keys)keys[k]=false;joy.active=false;hideStick();setMagnet(false);setPlaying(false);refreshHold();document.body.classList.add('shopOpen');renderShop();$('shop').classList.add('open');}
function closeShop(){if(!shopOpen)return;shopOpen=false;$('shop').classList.remove('open');$('board').classList.remove('open');document.body.classList.remove('shopOpen');refreshHold();store();setPlaying(true);}
(()=>{
  const sb=$('shopBtn');let lastTouch=0;
  const fire=()=>{initAudio();sb.blur();openShop();};
  sb.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();lastTouch=Date.now();fire();},{passive:false});
  sb.addEventListener('click',e=>{e.stopPropagation();if(Date.now()-lastTouch<700)return;fire();});
})();
$('resume').addEventListener('click',closeShop);
$('shop').addEventListener('click',e=>{
  const tb=e.target.closest('.tab');if(tb){$('cols').dataset.tab=tb.dataset.tab;$('tabUp').classList.toggle('on',tb.dataset.tab==='up');$('tabZn').classList.toggle('on',tb.dataset.tab==='zn');return;}
  const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.act;initAudio();
  if(a==='up'){const k=b.dataset.k,c=upCost(k);if(c!=null&&save.cash>=c&&!(UPS[k].unlock&&totLvl()<UPS[k].unlock)){save.cash-=c;save.up[k]++;sfx(k==='magnet'&&save.up.magnet===1?'up':'cha');store();renderShop();}}
  else if(a==='go'){const gi=+b.dataset.i;poki.commercial(()=>{save.zone=gi;resetZone();store();closeShop();});}
  else if(a==='unlock'){
    const i=+b.dataset.i,z=ZONES[i];
    if(save.cash>=z.cost&&totLvl()>=z.lvl){
      save.cash-=z.cost;save.zones[i]=true;if(!save.firsts[i])save.firsts[i]=Date.now();store();
      poki.commercial(()=>{save.zone=i;resetZone();store();renderShop();closeShop();banner(z.n[save.lang]);});
    }
  }
  else if(a==='lang'){toggleLang();}
  else if(a==='reward'){poki.rewarded(()=>{save.cash+=rewardAmt();sfx('up');store();renderShop();});}
  else if(a==='snd'){save.mute=!save.mute;syncMute();renderShop();}
});

/* ================= LOOP ================= */
function goFull(){
  try{const d=document.documentElement,rq=d.requestFullscreen||d.webkitRequestFullscreen;
    if(rq&&!(document.fullscreenElement||document.webkitFullscreenElement)){const p=rq.call(d);if(p&&p.catch)p.catch(()=>{});}
    if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
}
$('fsBtn').addEventListener('click',()=>{
  const fe=document.fullscreenElement||document.webkitFullscreenElement;
  if(fe){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}}else goFull();
});
if(isTouch)addEventListener('pointerdown',function f(){goFull();removeEventListener('pointerdown',f);},{once:true});
addEventListener('orientationchange',()=>setTimeout(resize,200));
try{matchMedia('(orientation:landscape)').addEventListener('change',()=>setTimeout(resize,150));}catch(e){}
document.addEventListener('fullscreenchange',()=>setTimeout(resize,100));
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
function baseZ(){return H>W?Math.min(H/1000,W/600):Math.min(W/1000,H/600);}
function resize(){
  {const land=innerWidth>=innerHeight;const u=Math.max(.3,Math.min(isTouch?1.1:1.4,land?Math.min(innerHeight/640,innerWidth/900):Math.min(innerWidth/520,innerHeight/900)));
  ['left','right','muteWrap','fsWrap','langWrap','hint','magBtn','nitroBtn'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.zoom=u;});
  ['mission','banner','timers'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.zoom=u;});
  const h=document.getElementById('hint');if(h)h.style.display=innerHeight<300?'none':'';}
  DPR=Math.min(isTouch?1.3:1.75,window.devicePixelRatio||1)*quality;W=Math.max(1,innerWidth||document.documentElement.clientWidth);H=Math.max(1,innerHeight||document.documentElement.clientHeight);
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  cam.z=Math.max(cam.z||0,W/world.w,H/world.h);
}
addEventListener('resize',resize);resize();
cam.z=baseZ()/(1+0.04*mZ());
applyLang();syncMute();
let last=performance.now(),fpsAcc=0,fpsN=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);
  const paused=shopOpen||document.hidden||focusLost||adActive||!started;refreshHold();
  if(document.hidden)return;
  if(!paused){fpsAcc+=dt;fpsN++;if(fpsAcc>1.5){const avg=fpsAcc/fpsN;fpsAcc=0;fpsN=0;if(avg>0.024&&quality>0.55){quality=Math.max(0.55,quality-0.15);resize();}}}
  if(!paused)update(dt);
  render();updateHud();updateAudio(paused);
}
requestAnimationFrame(frame);
requestAnimationFrame(()=>requestAnimationFrame(()=>{uiOk=true;poki.ready();}));
})();
</script>
